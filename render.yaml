services:
  - type: web
    name: heater-repair-workshop-api
    runtime: docker
    plan: free
    branch: hito-6
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/repair-orders
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

