spring:
  application:
    name: heater-repair-workshop
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/heater_workshop}
    username: ${DB_USERNAME:heater}
    password: ${DB_PASSWORD:heater_secret}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
server:
  error:
    include-message: never
    include-stacktrace: never
