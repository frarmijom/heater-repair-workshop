spring:
  application:
    name: heater-repair-workshop
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
server:
  error:
    include-message: never
    include-stacktrace: never
