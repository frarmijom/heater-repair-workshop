spring:
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
      whitelabel:
        enabled: false
  application:
    name: heater-repair-workshop
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: WORKSHOP_SESSION
        path: /
        http-only: true
        secure: true
        same-site: lax
